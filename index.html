<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ForgeHype Water — Demo</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#F3F3F6;--card:#FFFFFF;--card2:#F7F7F9;--ink:#121418;--ink2:#3E434C;--mute:#7C818B;--line:#E6E7EB;--line2:#EFF0F3;
 --acc:#FF5A00;
 --mint:#DDF4E8;--mint-i:#0F7A4D;--sky:#E1ECFF;--sky-i:#1C55D6;--sand:#FFF0CF;--sand-i:#8A5700;--rose:#FFE3E3;--rose-i:#C22B2B;--lilac:#ECE6FF;--lilac-i:#5B40D6;
 --r:22px;--r2:16px;--r3:12px;
 --sh:0 1px 2px rgba(16,18,24,.04),0 0 0 1px rgba(16,18,24,.035);
 --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
 --acc-t:color-mix(in srgb,var(--acc) 13%,var(--card));--acc-i:color-mix(in srgb,var(--acc) 82%,#000);--acc-h:color-mix(in srgb,var(--acc) 88%,#000);
 color-scheme:light;
}
[data-theme=dark]{
 --bg:#0C0D10;--card:#17191E;--card2:#1E2127;--ink:#F3F4F6;--ink2:#C7CAD1;--mute:#8E939D;--line:#262930;--line2:#1F2227;
 --mint:#0F2E22;--mint-i:#4ED39B;--sky:#13244A;--sky-i:#86ABFF;--sand:#382808;--sand-i:#FFC46A;--rose:#3B1818;--rose-i:#FF8A8A;--lilac:#241B45;--lilac-i:#BBA8FF;
 --sh:0 0 0 1px rgba(255,255,255,.05);
 --acc-t:color-mix(in srgb,var(--acc) 22%,var(--card));--acc-i:color-mix(in srgb,var(--acc) 75%,#fff);--acc-h:color-mix(in srgb,var(--acc) 85%,#fff);
 color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Figtree,-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.title{font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.h3{font-size:16px;font-weight:700}
.sub{color:var(--mute);font-size:14px}
.sm{font-size:13px}.xs{font-size:12px}
.mute{color:var(--mute)}.ink2{color:var(--ink2)}
.b{font-weight:700}.sb{font-weight:600}
.num{font-variant-numeric:tabular-nums}
.big{font-size:56px;line-height:1;font-weight:800;letter-spacing:-.03em}
.mid{font-size:34px;line-height:1;font-weight:800;letter-spacing:-.02em}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:4px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.c{text-align:center}
.sep{display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--mute);margin:0 7px;vertical-align:middle;opacity:.7}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:16px;height:16px}svg.i.l{width:24px;height:24px}

/* cards & lists */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.card.tight{padding:4px 16px}
.card.flat{box-shadow:none;background:var(--card2)}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line2)}
.li:first-child{border-top:0}
.li.tap{cursor:pointer}
.li .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.tint-mint{background:var(--mint);color:var(--mint-i)}.tint-sky{background:var(--sky);color:var(--sky-i)}.tint-sand{background:var(--sand);color:var(--sand-i)}.tint-rose{background:var(--rose);color:var(--rose-i)}.tint-lilac{background:var(--lilac);color:var(--lilac-i)}.tint-acc{background:var(--acc-t);color:var(--acc-i)}.tint-grey{background:var(--card2);color:var(--ink2)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;line-height:1.3;white-space:nowrap}
.pill.lg{padding:7px 13px;font-size:13px}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;letter-spacing:.01em}
.avatar.sm{width:34px;height:34px;font-size:13px}.avatar.lg{width:64px;height:64px;font-size:22px}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:8px;background:var(--acc)}
.bar.mint i{background:var(--mint-i)}.bar.rose i{background:var(--rose-i)}.bar.sand i{background:var(--sand-i)}
.kpi{padding:16px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.kpi .l{color:var(--mute);font-size:13px;margin-top:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);text-align:start;display:block;width:100%}
.tile .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;margin-bottom:12px}
.tile b{display:block;font-size:15px}.tile span{color:var(--mute);font-size:13px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{border-radius:16px;padding:10px 12px}
.stat3 b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat3 span{display:block;font-size:12px;line-height:1.25;margin-top:2px;opacity:.85}
.empty{color:var(--mute);text-align:center;padding:26px 12px;font-size:14px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 16px;font-weight:700;font-size:15px;line-height:1.2;transition:transform .08s ease,background .15s}
.btn:active{transform:scale(.985)}
.btn.p{background:var(--acc);color:#fff}.btn.p:hover{background:var(--acc-h)}
.btn.t{background:var(--acc-t);color:var(--acc-i)}
.btn.g{background:var(--card2);color:var(--ink)}
.btn.o{box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}
.btn.d{background:var(--rose);color:var(--rose-i)}
.btn.w{width:100%}.btn.lg{padding:16px 18px;font-size:16px;border-radius:18px}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ok{background:var(--mint-i);color:#fff}
.btn.c2{background:var(--card);box-shadow:var(--sh)}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--sh)}
.ib.flat{background:var(--card2);box-shadow:none}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:2px}
.seg button{flex:1;border-radius:11px;padding:9px 8px;font-weight:600;color:var(--mute);font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;background:var(--card);box-shadow:var(--sh);white-space:nowrap;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.field{display:block;margin-top:12px}
.field span{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.in{width:100%;border-radius:14px;padding:13px 14px;border:1px solid var(--line);background:var(--card);font-size:15px;appearance:none}
.in:focus{border-color:var(--acc);outline:0;box-shadow:0 0 0 3px var(--acc-t)}
textarea.in{min-height:92px;resize:vertical}
select.in{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%237C818B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:36px}
[dir=rtl] select.in{background-position:left 12px center;padding-right:14px;padding-left:36px}
.grp{background:var(--card);border-radius:var(--r2);box-shadow:var(--sh);overflow:hidden}
.grp .in{border:0;border-radius:0;border-top:1px solid var(--line2);background:transparent}
.grp .in:first-child{border-top:0}.grp .in:focus{box-shadow:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{position:relative;width:46px;height:28px;border-radius:14px;background:var(--line);transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--mint-i)}.sw.on::after{transform:translateX(18px)}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:start;border-radius:16px;padding:14px 16px;background:var(--card);box-shadow:var(--sh);margin-top:10px;font-weight:600}
.opt.on{box-shadow:inset 0 0 0 2px var(--acc)}
.opt small{display:block;font-weight:500;color:var(--mute);font-size:13px;margin-top:2px}
.toast{position:fixed;left:50%;transform:translate(-50%,10px);bottom:calc(28px + var(--sab));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;z-index:400;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:min(92vw,420px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.grab{width:38px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 14px}

/* phone frame */
.stage{min-height:100dvh;display:flex;align-items:center;justify-content:center;gap:40px;padding:40px 24px}
.phone{width:390px;height:844px;border-radius:56px;background:#0a0a0b;padding:12px;box-shadow:0 40px 90px rgba(0,0,0,.28),0 0 0 2px #2a2a2e inset;position:relative;flex:none}
.phone .screen{border-radius:44px;overflow:hidden;background:var(--bg);height:100%;position:relative;display:flex;flex-direction:column;color:var(--ink)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:34px;background:#000;border-radius:20px;z-index:6}
.statusbar{height:56px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 9px;font-weight:600;font-size:15px}
.statusbar .sig{display:flex;gap:5px;align-items:center}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 28px;overscroll-behavior:contain}
.tabbar{flex:none;display:flex;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line2);padding:8px 6px calc(8px + var(--sab))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--mute);border-radius:12px}
.tabbar button.on{color:var(--acc-i)}
.tabbar button.on svg{stroke:var(--acc)}
.foot{flex:none;padding:10px 16px calc(12px + var(--sab));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.foot.card-like{background:var(--card);border-top:1px solid var(--line2)}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .18s ease}
.sheet{background:var(--bg);border-radius:28px 28px 0 0;width:100%;max-height:90%;overflow:auto;padding:10px 16px calc(22px + var(--sab));animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sheet .title{font-size:24px}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.demo-pill{position:fixed;top:calc(12px + var(--sat));right:12px;z-index:300;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700;display:inline-flex;gap:6px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:.9}
.rail{width:300px;flex:none;color:var(--ink)}
.rail .card{padding:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand .mark{width:34px;height:34px;border-radius:11px;background:var(--acc);display:grid;place-items:center;color:#fff}
.brand .mark svg{stroke:#fff;width:18px;height:18px}
@media(max-width:899px){
 .stage{padding:0;gap:0;display:block;min-height:auto}
 .phone{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
 .phone .screen{border-radius:0}
 .island,.statusbar{display:none}
 .screen{padding-top:var(--sat)}
 .rail{display:none}
}
@media(max-height:900px) and (min-width:900px){.phone{transform:scale(.92);transform-origin:center}}
@media(max-height:820px) and (min-width:900px){.phone{transform:scale(.84)}}

/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.login .box{width:100%;max-width:420px}
.acct{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:12px;border-radius:16px;background:var(--card);box-shadow:var(--sh);margin-top:8px}
.acct:hover{background:var(--card2)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

/* gauge */
.gauge{width:54px;height:92px;border-radius:18px;background:var(--card2);position:relative;overflow:hidden;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.gauge i{position:absolute;left:0;right:0;bottom:0;background:var(--acc);transition:height .6s ease}
.gauge i::before{content:"";position:absolute;left:-10%;right:-10%;top:-6px;height:12px;background:var(--card2);border-radius:50%;opacity:.35}
.gauge.low i{background:var(--rose-i)}.gauge.warn i{background:var(--sand-i)}
.gauge::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:20px;height:8px;background:var(--line);border-radius:0 0 6px 6px;z-index:2}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .h{font-size:11px;font-weight:600;color:var(--mute);padding:6px 0}
.cal button{height:48px;border-radius:14px;font-weight:500;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink)}
.cal button.o{opacity:.3}.cal button.t{background:var(--acc-t);color:var(--acc-i);font-weight:700}.cal button.n{box-shadow:inset 0 0 0 2px var(--acc)}
.cal button.sel{background:var(--ink);color:var(--bg)}
.cal u{display:flex;gap:2px;height:5px;text-decoration:none}.cal u s{width:5px;height:5px;border-radius:50%;display:inline-block}

/* driver */
.stop{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px 12px 12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.stop.next{box-shadow:inset 0 0 0 2px var(--acc),var(--sh)}
.stop.done{opacity:.72}
.stop .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;background:var(--card2);color:var(--ink)}
.stop.next .n{background:var(--acc);color:#fff}.stop.done .n{background:var(--mint);color:var(--mint-i)}.stop.miss .n{background:var(--rose);color:var(--rose-i)}
.mv{display:flex;flex-direction:column;gap:3px}.mv button{width:30px;height:24px;border-radius:8px;background:var(--card2);display:grid;place-items:center}
.mv button:disabled{opacity:.3}
.mapbox{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:12px}
.mapbox>svg{display:block;width:100%;height:auto}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}
.acts a,.acts button{border-radius:16px;padding:12px 6px;font-weight:700;text-align:center;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.step{display:flex;align-items:center;gap:12px}
.step button{width:46px;height:46px;border-radius:50%;background:var(--card2);display:grid;place-items:center}
.step button.p{background:var(--ink);color:var(--bg)}
.step span{font-size:34px;font-weight:800;min-width:36px;text-align:center;letter-spacing:-.02em}
.photo{border:2px dashed var(--line);border-radius:18px;background:var(--card2);min-height:120px;display:grid;place-items:center;text-align:center;font-weight:600;padding:14px;margin-top:12px;overflow:hidden;cursor:pointer;color:var(--ink2)}
.photo img{max-width:100%;max-height:220px;border-radius:12px;display:block}
.bigok{width:120px;height:120px;border-radius:50%;background:var(--mint-i);color:#fff;display:grid;place-items:center;margin:26px auto 16px;box-shadow:0 0 0 14px var(--mint)}
.bigok svg{width:56px;height:56px;stroke-width:2.4}

/* admin */
.adm{display:grid;grid-template-columns:248px 1fr;min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;border-right:1px solid var(--line);background:var(--card);padding:22px 14px 18px;display:flex;flex-direction:column;gap:6px}
.side .nav{margin-top:18px;display:flex;flex-direction:column;gap:2px}
.side .nav button,.side .nav .lbl{display:flex;gap:11px;align-items:center;width:100%;padding:10px 12px;border-radius:12px;color:var(--ink2);font-weight:600;font-size:14px;text-align:start}
.side .nav button:hover{background:var(--card2)}
.side .nav button.on{background:var(--acc-t);color:var(--acc-i)}
.side .nav .lbl{color:var(--mute);font-size:12px;font-weight:600;padding:14px 12px 4px}
.side .me{margin-top:auto;padding-top:12px;border-top:1px solid var(--line2)}
.main{padding:28px 32px 48px;max-width:1240px;width:100%;margin:0 auto}
.main.center{display:flex;flex-direction:column;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:start;font-size:12px;font-weight:600;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line2)}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line2);vertical-align:middle;font-size:14px}
.tbl tr.tap{cursor:pointer}.tbl tr.tap:hover td{background:var(--card2)}
.tbl tr:last-child td{border-bottom:0}
.mtab{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line2);padding:8px 6px calc(8px + var(--sab))}
.mtab button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--mute)}
.mtab button.on{color:var(--acc-i)}.mtab button.on svg{stroke:var(--acc)}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.search{position:relative}.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute)}
.search .in{padding-left:42px}
[dir=rtl] .search svg{left:auto;right:14px}[dir=rtl] .search .in{padding-left:14px;padding-right:42px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;animation:fade .18s}
.modal .sheet{max-width:560px;border-radius:26px;max-height:92vh;padding:22px 22px 24px;animation:pop .22s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:.6}to{transform:none;opacity:1}}
.swatch{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 2px var(--card),0 0 0 3px transparent;cursor:pointer}
.swatch.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.spark{display:flex;align-items:flex-end;gap:6px;height:120px}
.spark div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mute);height:100%;justify-content:flex-end}
.spark i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--acc);opacity:.85;min-height:3px}
.spark i.m{background:var(--rose-i)}.spark div.on i{opacity:1}
.feed{position:relative;padding-left:18px}.feed::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:2px;background:var(--line2)}
.feed .li{position:relative;border-top:0;padding:8px 0}
.feed .li::before{content:"";position:absolute;left:-18px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 3px var(--line)}
.feed .li.ok::before{box-shadow:inset 0 0 0 3px var(--mint-i)}.feed .li.bad::before{box-shadow:inset 0 0 0 3px var(--rose-i)}.feed .li.top::before{box-shadow:inset 0 0 0 3px var(--sky-i)}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:899px){
 .adm{display:block}.side{display:none}.main{padding:calc(16px + var(--sat)) 16px 110px}.mtab{display:flex}
 .cols{grid-template-columns:1fr}.tbl thead{display:none}.tbl,.tbl tbody,.tbl tr,.tbl td{display:block}
 .tbl tr{padding:10px 0;border-bottom:1px solid var(--line2)}.tbl td{padding:2px 0;border:0}.tbl td.hide-m{display:none}
 .modal{align-items:flex-end;padding:0}.modal .sheet{max-width:none;border-radius:28px 28px 0 0;max-height:92dvh}
 .kpis{gap:10px}.kpi .v{font-size:26px}
 .adm.previewing .mtab{display:none}.adm.previewing .main{padding:calc(12px + var(--sat)) 0 0}.adm.previewing .main>.row{padding:0 16px}.adm.previewing .phone{height:calc(100dvh - 108px - var(--sat))}.adm.previewing .main>p{display:none}
}

/* live map */
.mapwrap{position:relative}
.lmap{height:270px;width:100%;background:var(--card2);position:relative;z-index:0;isolation:isolate}
.mapwrap.sm .lmap{height:180px}.mapwrap.lg .lmap{height:380px}
.mapchip{position:absolute;left:12px;top:12px;z-index:5;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:14px;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:13px;max-width:72%;pointer-events:none}
.mapchip b{display:block;line-height:1.25}.mapchip span{color:var(--mute);font-size:12px}
.tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
.maprc.on{background:#1C55D6;color:#fff}
.mapchip span svg{width:12px;height:12px;vertical-align:-2px}
.maprc{position:absolute;right:12px;bottom:26px;z-index:5;width:36px;height:36px;border-radius:50%;background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.18);display:grid;place-items:center}
.mapnote{position:absolute;left:12px;right:60px;bottom:28px;z-index:5;background:var(--sand);color:var(--sand-i);font-size:12px;padding:8px 10px;border-radius:10px;font-weight:600}
.mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 Figtree,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.25);border:2px solid #fff;background:#fff;color:#111}
.mk svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mk.d{background:#12a36b;color:#fff}.mk.m{background:#c92f2f;color:#fff}.mk.p{border-color:#111}
.mk.n{background:var(--acc);color:#fff;width:34px;height:34px;font-size:14px;position:relative}
.mk.n::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:var(--acc);opacity:.3;animation:pulse 1.6s ease-out infinite;z-index:-1}
.mk.depot{background:#111318;color:#fff;border-color:#fff}
.drv{position:relative;width:38px;height:38px;border-radius:50%;background:#111318;color:#fff;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.drv svg{width:18px;height:18px;stroke:#fff;fill:#fff;stroke-width:1.5;transition:transform .8s linear}
.drv .halo{position:absolute;inset:-3px;border-radius:50%;background:#111318;opacity:.2;animation:pulse 2s ease-out infinite;z-index:-1}
.drv .lbl{position:absolute;left:44px;top:7px;background:#111318;color:#fff;border-radius:999px;padding:3px 9px;font:700 12px Figtree,sans-serif;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.homepin{width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--acc);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25);display:grid;place-items:center}
.homepin svg{transform:rotate(45deg);stroke:#fff;width:14px;height:14px}
.maptip{font:500 12px/1.35 Figtree,sans-serif;border-radius:10px;border:0;box-shadow:0 4px 14px rgba(0,0,0,.15);padding:8px 10px;background:var(--card);color:var(--ink)}
.leaflet-tooltip-top.maptip:before{border-top-color:var(--card)}
.leaflet-container{font-family:Figtree,sans-serif;background:var(--card2)}.leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.65)!important;color:#555}
[data-theme=dark] .leaflet-control-attribution{background:rgba(0,0,0,.5)!important;color:#aaa}
@keyframes pulse{0%{transform:scale(.7);opacity:.35}100%{transform:scale(2.1);opacity:0}}
.demo-bar{display:none;flex:none;align-items:center;justify-content:space-between;gap:8px;padding:7px 14px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600}
.demo-bar button{color:inherit;font-weight:700;display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;background:rgba(255,255,255,.14)}
@media(max-width:899px){.demo-bar{display:flex}.demo-pill{display:none}}

	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {
	bottom: 0;
	margin-bottom: -12px;
	border-top-color: #fff;
	}
.leaflet-tooltip-bottom:before {
	top: 0;
	margin-top: -12px;
	margin-left: -6px;
	border-bottom-color: #fff;
	}
.leaflet-tooltip-left {
	margin-left: -6px;
}
.leaflet-tooltip-right {
	margin-left: 6px;
}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	top: 50%;
	margin-top: -6px;
	}
.leaflet-tooltip-left:before {
	right: 0;
	margin-right: -12px;
	border-left-color: #fff;
	}
.leaflet-tooltip-right:before {
	left: 0;
	margin-left: -12px;
	border-right-color: #fff;
	}

/* Printing */

@media print {
	/* Prevent printers from removing background-images of controls. */
	.leaflet-control {
		-webkit-print-color-adjust: exact;
		print-color-adjust: exact;
		}
	}

const D=()=>S.data;

const ledgerOf=cid=>D().ledger.filter(e=>e.cid===cid).sort((a,b)=>new Date(b.at)-new Date(a.at));
const usedBetween=(cid,from,to)=>-sum(D().ledger.filter(e=>e.cid===cid&&e.kind==='delivered'&&new Date(e.at)>=from&&new Date(e.at)<to),e=>e.coupons);
const avgMonthly=cid=>Math.round(usedBetween(cid,addDays(TODAY,-84),addDays(TODAY,1))/84*30);
const daysLeft=cid=>{const a=avgMonthly(cid);return a?Math.round(bal(cid)/(a/30)):null};
const status=c=>{const b=bal(c.id),s=D().settings;return b<=s.lowAt?['rose','Low']:b<=s.warnAt?['sand','Running low']:['mint','Healthy']};
const lastTopup=cid=>ledgerOf(cid).find(e=>e.kind==='topup'&&e.amount);
const onHold=(c,ds)=>c.holds.some(h=>{const s=parseYmd(h.start),e=addDays(s,h.days-1);const d=parseYmd(ds);return d>=s&&d<=e});
const nextHold=c=>c.holds.map(h=>({...h,end:ymd(addDays(parseYmd(h.start),h.days-1))})).filter(h=>h.end>=TODAY_S).sort((a,b)=>a.start.localeCompare(b.start))[0];
const stopsOf=cid=>D().routes.flatMap(r=>r.stops.filter(s=>s.cid===cid).map(s=>({...s,route:r})));
const todayStop=cid=>stopsOf(cid).find(s=>s.route.date===TODAY_S);
function nextDelivery(c){
 const ts=todayStop(c.id);if(ts&&ts.status==='pending')return {date:TODAY_S,today:true,stop:ts};

  if(d.getDay()===c.weekday&&!onHold(c,s)){if(c.resched&&c.resched.from===s)return {date:c.resched.to,moved:true};return {date:s}}
  if(c.resched&&c.resched.to===s&&!onHold(c,s))return {date:s,moved:true};

const DR={

 head(label,back){return `<div class="row sp" style="padding-top:8px"><button class="ib" onclick="DR.go('${back||'route'}')" aria-label="Back">${ic('left')}</button><span class="pill lg" style="background:var(--ink);color:var(--bg)">${label}</span><span style="width:40px"></span></div>`},
 /* --- map --- */
 map(stops,nx){if(!stops.length)return '';const W=358,H=190,p=28;const la=stops.map(s=>cust(s.cid).lat),lo=stops.map(s=>cust(s.cid).lng);let minLa=Math.min(...la),maxLa=Math.max(...la),minLo=Math.min(...lo),maxLo=Math.max(...lo);
  if(maxLa-minLa<.004){minLa-=.002;maxLa+=.002}if(maxLo-minLo<.004){minLo-=.002;maxLo+=.002}
  const pt=s=>{const c=cust(s.cid);return [p+(c.lng-minLo)/(maxLo-minLo)*(W-2*p),H-p-(c.lat-minLa)/(maxLa-minLa)*(H-2*p)]};
  const pts=stops.map(pt);for(let it=0;it<30;it++){for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=pts[j][0]-pts[i][0],dy=pts[j][1]-pts[i][1],dd=Math.hypot(dx,dy)||.01;if(dd<34){const f=(34-dd)/2,ux=dx/dd,uy=dy/dd;pts[i][0]-=ux*f;pts[i][1]-=uy*f;pts[j][0]+=ux*f;pts[j][1]+=uy*f}}pts.forEach(q=>{q[0]=clamp(q[0],18,W-18);q[1]=clamp(q[1],18,H-18)})}
  const ptOf=s=>pts[stops.indexOf(s)];let d='';pts.forEach((q,i)=>{if(!i){d='M'+q[0]+' '+q[1];return}const a=pts[i-1],mx=(a[0]+q[0])/2;d+=` C${mx} ${a[1]} ${mx} ${q[1]} ${q[0]} ${q[1]}`});
  const col=s=>s.status==='delivered'?'var(--mint-i)':s.status==='missed'?'var(--rose-i)':nx&&s.id===nx.id?'var(--acc)':'var(--card)';
  const txt=s=>s.status==='pending'&&!(nx&&s.id===nx.id)?'var(--ink)':'#fff';
  const lastDone=[...stops].reverse().find(s=>s.status!=='pending');
  return `<div class="mapbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Route overview">
  <defs><pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="var(--line2)" stroke-width="1"/></pattern></defs>
  <rect width="${W}" height="${H}" fill="var(--card)"/><rect width="${W}" height="${H}" fill="url(#g)"/>
  <path d="${d}" fill="none" stroke="var(--line)" stroke-width="8" stroke-linecap="round"/><path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round" opacity=".45"/>
  ${stops.map((s,i)=>{const [x,y]=pts[i];const isN=nx&&s.id===nx.id;return `${isN?`<circle cx="${x}" cy="${y}" r="20" fill="var(--acc)" opacity=".18"/>`:''}<circle cx="${x}" cy="${y}" r="13" fill="${col(s)}" stroke="${s.status==='pending'&&!isN?'var(--ink)':'var(--card)'}" stroke-width="2"/><text x="${x}" y="${y+4.5}" text-anchor="middle" font-size="12" font-weight="700" fill="${txt(s)}" font-family="inherit">${s.status==='delivered'?'✓':s.status==='missed'?'!':s.seq}</text>`}).join('')}
  ${lastDone?(()=>{const [x,y]=ptOf(lastDone);return `<g transform="translate(${x+14},${y-26})"><rect width="54" height="20" rx="10" fill="var(--ink)"/><text x="27" y="14" text-anchor="middle" font-size="11" font-weight="700" fill="var(--bg)" font-family="inherit">You</text></g>`})():''}

 cdet(id){const c=cust(id),[tone,lab]=status(c),h=ledgerOf(id).slice(0,6),nd=nextDelivery(c),dr=driverFor(c),hold=nextHold(c),tk=D().tickets.filter(t=>t.cid===id&&t.status!=='resolved');

 parsePin(t){try{t=decodeURIComponent(t.trim())}catch(e){t=t.trim()}if(!t)return null;const m=t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||t.match(/[?&](?:q|ll|query)=(-?\d+\.\d+),(-?\d+\.\d+)/)||t.match(/^(-?\d+\.?\d*)[ ,]+(-?\d+\.?\d*)$/);return m?[+m[1],+m[2]]:false},
 saveCust(id){const c=cust(id);const v=i=>$('#'+i).value.trim();if(!v('en'))return toast('Name is required');const pin=AD.parsePin(v('el'));if(pin===false)return toast('Map pin not understood. Paste a Google Maps link or "25.26, 51.45".');

 stopDet(id){const {s,r}=findStop(id),c=cust(s.cid);sheet(`<div class="row sp"><h2 class="title" style="font-size:22px">${esc(c.name)}</h2><span class="pill tint-${s.status==='delivered'?'mint':'rose'}">${s.status}</span></div><div class="sub mt4">${esc(r.name)}, ${fmtD(r.date)}, stop ${s.seq}, ${esc(drv(r.driver).name)}</div>

 sendReply(id){const v=$('#tr').value.trim();if(!v)return;ACT.reply(id,'support',v);if(/goodwill coupons/i.test(v)&&AD.isAdmin()){const t=D().tickets.find(t=>t.id===id);ACT.adjust(t.cid,2,'Goodwill for ticket')}toast('Reply sent');AD.tkt(id)},
 /* --- Reports --- */
 rep(){const m0=monthStart(),L=D().ledger.filter(e=>new Date(e.at)>=m0),del=L.filter(e=>e.kind==='delivered'),miss=L.filter(e=>e.kind==='missed'),sold=L.filter(e=>e.kind==='topup'&&e.amount);

 csv(kind){let rows,name;const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';

 copyCsv(b){const ta=$('#dim textarea');ta.select();try{navigator.clipboard.writeText(AD._csv).then(()=>toast('Copied'),()=>{document.execCommand('copy');toast('Copied')})}catch(e){try{document.execCommand('copy');toast('Copied')}catch(x){toast('Select the text and copy it')}}},
 dlCsv(name){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+AD._csv],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Downloading '+name+'. If nothing happens here, use Copy.')}catch(e){toast('Download blocked in this preview. Use Copy.')}},
 /* --- Settings --- */
 set(){const s=D().settings;const inp=(k,lab,type)=>`<label class="field"><span>${lab}</span><input class="in" type="${type||'text'}" value="${esc(s[k])}" onchange="D().settings['${k}']=${type==='number'?'+':''}this.value;save();applyTheme();toast('Saved');render()"></label>`;
  return AD.head('Settings','White-label the apps for your company. Changes apply everywhere immediately.')+
  `<div class="cols"><div><div class="card"><b class="h3">Brand</b>${inp('company','Company name shown in all three apps')}<div class="field"><span>Accent colour</span><div class="row" style="gap:12px">${Object.entries(ACCENTS).map(([k,v])=>`<button class="swatch ${s.accent===k?'on':''}" style="background:${v}" title="${k}" onclick="D().settings.accent='${k}';save();applyTheme();render()"></button>`).join('')}</div></div>${inp('currency','Currency code')}</div>
   <div class="card"><b class="h3">Support contact</b>${inp('supportPhone','Phone shown to customers')}${inp('supportWa','WhatsApp number')}</div>
   <div class="card"><b class="h3">Coupon rules</b><div class="two">${inp('warnAt','"Running low" at or below','number')}${inp('lowAt','"Low" alert at or below','number')}</div>${inp('holdMax','Maximum hold, days','number')}</div></div>
  <div><div class="card"><div class="row sp"><b class="h3">Coupon packs</b><button class="btn sm g" onclick="D().packs.push({id:'p'+uid(),coupons:90,price:600});save();render()">${ic('plus','s')} Add pack</button></div><table class="tbl mt8"><thead><tr><th>Coupons</th><th>Price</th><th>Per bottle</th><th></th></tr></thead><tbody>${D().packs.map(p=>`<tr><td><input class="in" type="number" value="${p.coupons}" style="width:90px;padding:8px 10px" onchange="(function(v){const p=D().packs.find(x=>x.id==='${p.id}');p.coupons=+v||p.coupons;save();render()})(this.value)"></td><td><input class="in" type="number" value="${p.price}" style="width:100px;padding:8px 10px" onchange="(function(v){const p=D().packs.find(x=>x.id==='${p.id}');p.price=+v||p.price;save();render()})(this.value)"></td><td class="num hide-m">${(p.price/p.coupons).toFixed(2)}</td><td style="text-align:end">${D().packs.length>1?`<button class="ib flat" onclick="D().packs=D().packs.filter(x=>x.id!=='${p.id}');save();render()" aria-label="Remove">${ic('x','s')}</button>`:''}</td></tr>`).join('')}</tbody></table></div>
   <div class="card"><b class="h3">Zones and drivers</b><div class="mt4">${D().zones.map(z=>`<div class="li"><span class="grow">${esc(z.name)}</span><select class="in" style="width:auto;padding:6px 34px 6px 10px" onchange="(function(v){const z=zone('${z.id}');z.drv=v;D().drivers.forEach(d=>{d.zones=d.zones.filter(x=>x!=='${z.id}');if(d.id===v)d.zones.push('${z.id}')});save();render()})(this.value)">${D().drivers.map(d=>`<option value="${d.id}" ${z.drv===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div>`).join('')}</div></div>
   <div class="card"><b class="h3">Team</b>${D().staff.map(x=>`<div class="li"><span class="avatar sm tint-acc">${initials(x.name)}</span><div class="grow"><b>${esc(x.name)}</b><div class="sub xs">${esc(x.email)}</div></div><span class="pill tint-${x.role==='admin'?'lilac':'grey'}">${x.role}</span></div>`).join('')}<p class="sub sm mt8">Admins can adjust coupons and manage drivers. Support can do everything else.</p></div>
   <div class="card"><b class="h3">Activity log</b><div class="feed mt12">${D().audit.slice(0,8).map(a=>`<div class="li"><div class="grow"><div class="sm">${esc(a.who)} ${esc(a.what.charAt(0).toLowerCase()+a.what.slice(1))}</div><div class="xs mute">${fmtD(a.at)}, ${hm(a.at)}</div></div></div>`).join('')}</div></div>
   <div class="card"><b class="h3">Demo</b><p class="sub sm mt4">Sample data regenerates for the current date. Reset puts everything back, including anything you changed here.</p><div class="row mt12"><button class="btn g" onclick="toggleTheme()">${ic('moon','s')} Switch theme</button><button class="btn d" onclick="resetDemo()">${ic('refresh','s')} Reset demo data</button></div></div></div></div>`},
 more(){return AD.head('More')+`<div class="card tight">${[['drv','truck','Drivers','Vehicles, zones and progress'],['rep','chart','Reports','Monthly numbers and exports'],['set','sliders','Settings','Brand, packs, zones, team']].map(n=>`<div class="li tap" onclick="AD.go('${n[0]}')"><span class="ic tint-grey">${ic(n[1])}</span><div class="grow"><b>${n[2]}</b><div class="sub sm">${n[3]}</div></div>${ic('right')}</div>`).join('')}</div>
  <div class="card tight"><div class="li tap" onclick="AD.preview('driver')"><span class="ic tint-mint">${ic('phone')}</span><div class="grow"><b>Driver app</b><div class="sub sm">See what a driver sees today</div></div>${ic('right')}</div><div class="li tap" onclick="AD.preview('customer')"><span class="ic tint-sky">${ic('phone')}</span><div class="grow"><b>Customer app</b><div class="sub sm">Open any customer's app</div></div>${ic('right')}</div></div>
  <div class="card tight"><div class="li tap" onclick="toggleTheme()"><span class="ic tint-grey">${ic('moon')}</span><span class="grow b">Switch light / dark</span></div><div class="li tap" onclick="signOut()"><span class="ic tint-rose">${ic('logout')}</span><span class="grow b">Sign out</span><span class="sub sm">${esc(S.me.name)}</span></div></div>`}
};
/* ---- boot ---- */
(function(){if(!load()){S.data=genData();save()}applyTheme();render();
 matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(!S.theme){applyTheme()}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
})();
</script>
</body>
</html>
