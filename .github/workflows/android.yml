name: Android APK

on:
  push:
    branches: [main]
    paths: [index.html, manifest.webmanifest, icons/**, assets/**, capacitor.config.json, package.json, .github/workflows/android.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Prepare web assets
        run: npm run www

      - name: Add Android platform
        run: npx cap add android

      - name: Permissions (location, camera)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' $M
          grep -n "permission" $M

      - name: App icon and splash
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#FF5A00' --iconBackgroundColorDark '#FF5A00' --splashBackgroundColor '#F3F3F6' --splashBackgroundColorDark '#0C0D10'

      - name: Version
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" $G
          grep -n "version" $G

      - name: Sync and build
        run: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Rasid-Water.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Rasid-Water-apk
          path: Rasid-Water.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Rasid Water 1.0.${{ github.run_number }} (Android)
          make_latest: true
          files: Rasid-Water.apk
          body: |
            Android app for the Rasid Water demo.

            **Install:** download `Rasid-Water.apk` on your Android phone, open it, and allow "Install unknown apps" for your browser when asked.
            Sign in with any demo account, password `0000`.

            iPhone: open https://forgehypeqa.github.io/Rasid-water/ in Safari, tap Share, then Add to Home Screen.
